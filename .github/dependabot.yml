version: 2
updates:
  # GitHub Actions - semiannually updates with groups
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    # GitHub Actions have a steady update interval. Update semiannually to reduce update PRs.
    schedule:
      interval: "semiannually"
    groups:
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"

  # Core dependencies - semiannual updates with groups
  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 4
    # Update core dependencies semiannually because core dependencies are somewhat stable.
    #
    # Developers can update dependencies via dependabot manually by:
    # 1. Go to Dependabot page https://github.com/dentiny/lance-duckdb/network/updates
    # 2. Choose a project by "Recent update jobs"
    # 3. Click "Check for updates"
    schedule:
      interval: "semiannually"
    groups:
      # Lance and its compatible Arrow and DataFusion dependencies
      lance-stack:
        patterns:
          - "lance*"
          - "arrow*"
          - "datafusion*"
      # Serialization and date/time utilities
      serialization-utils:
        patterns:
          - "chrono"
          - "serde*"
      # Async runtime and runtime tools
      async-runtime:
        patterns:
          - "tokio*"
          - "async-*"
          - "futures*"
      # Error handling
      error-handling:
        patterns:
          - "anyhow"
          - "snafu"
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "lance*"
          - "arrow*"
          - "datafusion*"
          # Please upgrade to new APIs when updating "rand"
          - "rand"
